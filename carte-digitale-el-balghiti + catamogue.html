<title>El balghiti parfums – عطور البلفيتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#000;
  --or-clair:#f1d98a;
  --or:#d4a843;
  --or-fonce:#8f6a1f;
  --texte:#ecdcae;
  --texte-doux:#a99a73;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--noir);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;background:var(--noir);color:var(--texte);
  font-family:"Lato","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  display:flex;justify-content:center;
}
.carte{
  width:100%;max-width:440px;margin:14px;
  border:1px solid var(--or);border-radius:28px;
  padding:34px 22px 22px;
  display:flex;flex-direction:column;align-items:center;
}
.logo{width:100%;max-width:340px;height:auto;display:block}
.liste{width:100%;margin:30px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.btn{
  display:flex;align-items:center;gap:14px;width:100%;
  min-height:58px;padding:0 20px;border-radius:16px;
  border:1px solid var(--or);background:transparent;color:var(--or-clair);
  font:inherit;font-size:1.02rem;font-weight:400;letter-spacing:.01em;text-decoration:none;
  cursor:pointer;transition:background .2s,color .2s,transform .12s;
}
.btn svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn svg .plein{fill:currentColor;stroke:none}
.btn span.sous{display:block;font-size:.82rem;color:var(--texte-doux);margin-top:2px;transition:color .2s}
.btn:hover{background:rgba(212,168,67,.12)}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:2px solid var(--or-clair);outline-offset:3px}
.principal{
  min-height:64px;border:none;font-weight:700;color:#1a1204;
  background:linear-gradient(100deg,var(--or-fonce) 0%,var(--or-clair) 45%,var(--or) 75%,var(--or-fonce) 100%);
}
.principal:hover{background:linear-gradient(100deg,var(--or-fonce) 0%,var(--or-clair) 45%,var(--or) 75%,var(--or-fonce) 100%);filter:brightness(1.08)}
.principal svg{stroke-width:1.9}
.btn .txt{display:block;line-height:1.2}
.merci{margin:14px 0 0;min-height:1.2em;font-size:.88rem;color:var(--or-clair);text-align:center}
.signature{
  margin-top:26px;padding-top:16px;width:100%;
  border-top:1px solid rgba(212,168,67,.3);
  text-align:center;font-size:.8rem;color:var(--texte-doux);font-weight:300;
}
.signature b{font-weight:700;color:var(--or)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
@media (min-width:480px){.carte{margin:32px 14px;align-self:flex-start}}
</style>
</head>
